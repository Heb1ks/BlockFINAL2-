specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: GameToken
    network: arbitrum-sepolia
    source:
      address: "0x4b733e9e1328F5b7FE865cA87cb073f98A12195f"
      abi: GameToken
      startBlock: 265000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenTransfer
      abis:
        - name: GameToken
          file: ./abis/GameToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mappings.ts

  # ─── GameAMM ────────────────────────────────────────────────────────────────
  - kind: ethereum
    name: GameAMM
    network: arbitrum-sepolia
    source:
      address: "0x36E6D1a755c9b81c24C138f4c3FbaCeBe2AbEdB5"
      abi: GameAMM
      startBlock: 265000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - LiquidityEvent
        - AMMPool
      abis:
        - name: GameAMM
          file: ./abis/GameAMM.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,bool)
          handler: handleSwap
        - event: LiquidityAdded(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityAdded
        - event: LiquidityRemoved(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityRemoved
      file: ./src/mappings.ts

  # ─── NFTRentalVault ──────────────────────────────────────────────────────────
  - kind: ethereum
    name: NFTRentalVault
    network: arbitrum-sepolia
    source:
      address: "0x3A05363578B06a92fCFa7A2C8C57684f72F89B5c"
      abi: NFTRentalVault
      startBlock: 265000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Listing
        - Rental
      abis:
        - name: NFTRentalVault
          file: ./abis/NFTRentalVault.json
      eventHandlers:
        - event: ItemListed(indexed uint256,indexed address,uint256,uint256,uint256)
          handler: handleItemListed
        - event: ItemRented(indexed uint256,indexed uint256,indexed address,uint256)
          handler: handleItemRented
        - event: RentalEnded(indexed uint256,indexed uint256)
          handler: handleRentalEnded
        - event: ItemDelisted(indexed uint256)
          handler: handleItemDelisted
      file: ./src/mappings.ts

  # ─── GameDAO ─────────────────────────────────────────────────────────────────
  - kind: ethereum
    name: GameDAO
    network: arbitrum-sepolia
    source:
      address: "0x27344475649463373e1205A122E33536c34AF8cD"
      abi: GameDAO
      startBlock: 265000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Vote
      abis:
        - name: GameDAO
          file: ./abis/GameDAO.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
      file: ./src/mappings.ts

  # ─── LootDrop ────────────────────────────────────────────────────────────────
  - kind: ethereum
    name: LootDrop
    network: arbitrum-sepolia
    source:
      address: "0x38Fd68F4b1DF77937a05F268952f885Bf73dE97E"
      abi: LootDrop
      startBlock: 265000000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LootRequest
      abis:
        - name: LootDrop
          file: ./abis/LootDrop.json
      eventHandlers:
        - event: LootRequested(indexed uint256,indexed address)
          handler: handleLootRequested
        - event: LootFulfilled(indexed uint256,indexed address,uint256,bool)
          handler: handleLootFulfilled
      file: ./src/mappings.ts
